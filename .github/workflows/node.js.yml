# Clean install, format/lint gates, TypeScript build, and test suite across
# the supported Node.js versions.

name: Node.js CI

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 18.x is the actual runtime on the Raspberry Pi this project targets
        # (Raspbian Buster can't be upgraded past it); 20.x/22.x are current
        # LTS/active releases. See https://nodejs.org/en/about/previous-releases.
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run prettier-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          CI: true
