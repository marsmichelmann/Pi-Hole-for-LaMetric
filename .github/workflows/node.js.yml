# Clean install, format/lint gates, TypeScript build, and test suite on the
# Node.js version this actually runs on.

name: Node.js CI

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 18.x is the actual runtime on the Raspberry Pi this project targets -
      # Raspbian Buster's libstdc++ can't run anything newer, so that's the
      # only version worth testing against.
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run prettier-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          CI: true
